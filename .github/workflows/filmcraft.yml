name: FilmCraft Jarvis

# FilmCraft (storytold/filmcraft) con il comando in più "Aggiungi taglio e seleziona"
# (filmcraft/jarvis.patch). Ricompilato ogni lunedì dall'ultima versione ufficiale.
on:
  workflow_dispatch:
    inputs:
      warm:
        description: "Solo riscalda la cache (compila senza pubblicare)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "filmcraft/**"
      - ".github/workflows/filmcraft.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione ufficiale
        id: up
        shell: bash
        run: |
          set -e
          git clone -q https://github.com/storytold/filmcraft.git fc
          cd fc
          ok=""
          tag=$(gh release view -R storytold/filmcraft --json tagName -q .tagName 2>/dev/null || true)
          base=$(cat ../filmcraft/base.txt 2>/dev/null || true)
          for ref in "$tag" main "$base"; do
            [ -z "$ref" ] && continue
            git checkout -q -f "$ref" && git reset -q --hard && git clean -qfd
            if git apply --3way ../filmcraft/jarvis.patch 2>/dev/null || git apply ../filmcraft/jarvis.patch; then ok="$ref"; break; fi
          done
          [ -n "$ok" ] || { echo "la patch non si applica"; exit 1; }
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          sha=$(git rev-parse --short HEAD)
          echo "ref=$ok ver=$ver sha=$sha"
          echo "ver=$ver" >> $GITHUB_OUTPUT
          echo "tag=filmcraft-jarvis-$ver-$sha-p$(sha1sum ../filmcraft/jarvis.patch | cut -c1-6)" >> $GITHUB_OUTPUT

      - name: Già compilata?
        id: have
        shell: bash
        run: |
          if gh release view "${{ steps.up.outputs.tag }}" >/dev/null 2>&1; then
            if [ "${{ inputs.warm }}" = "true" ]; then echo "nopublish=1" >> $GITHUB_OUTPUT; else echo "skip=1" >> $GITHUB_OUTPUT; fi
          fi

      - name: Strumenti
        if: steps.have.outputs.skip != '1'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          dotnet tool install --global wix --version 5.0.2

      - name: Cache della compilazione (le build dopo la prima ripartono da qui)
        if: steps.have.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fc/target
          key: fcj-${{ runner.os }}-${{ hashFiles('fc/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fcj-${{ runner.os }}-${{ hashFiles('fc/Cargo.lock') }}-
            fcj-${{ runner.os }}-

      - name: Compila e impacchetta
        if: steps.have.outputs.skip != '1'
        shell: pwsh
        working-directory: fc
        env:
          # compilazione più veloce (niente LTO, più unità in parallelo): l'app va uguale
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_INCREMENTAL: "1"
        run: |
          $env:DIST = Join-Path $PWD 'dist'
          ./packaging/windows/package.ps1 -Arch x64
          Get-ChildItem $env:DIST
          # funzioni di questa build (lette da Jarvis Clipper) e versione per l'aggiornamento interno
          $z = Get-ChildItem (Join-Path $env:DIST '*-portable.zip') | Select-Object -First 1
          $tmp = Join-Path $env:RUNNER_TEMP 'fcj'
          Expand-Archive -Path $z.FullName -DestinationPath $tmp -Force
          $inner = Get-ChildItem $tmp -Directory | Select-Object -First 1
          $dst = if ($inner) { $inner.FullName } else { $tmp }
          Set-Content -Encoding ascii -Path (Join-Path $dst 'jarvis_caps.txt') -Value @('adjustment', 'update')
          Set-Content -Encoding ascii -Path (Join-Path $dst 'jarvis_tag.txt') -Value '${{ steps.up.outputs.tag }}'
          Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'FilmCraft-Jarvis-portable.zip') -Force

      - name: Pubblica
        if: steps.have.outputs.skip != '1' && steps.have.outputs.nopublish != '1'
        shell: bash
        run: |
          gh release create "${{ steps.up.outputs.tag }}" FilmCraft-Jarvis-portable.zip \
            --title "FilmCraft Jarvis ${{ steps.up.outputs.ver }}" --latest=false \
            --notes "FilmCraft ${{ steps.up.outputs.ver }} ufficiale + comando 'Aggiungi taglio e seleziona' (menu Sequenza). Versione portatile: estrai e apri filmcraft.exe."
